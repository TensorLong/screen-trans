name: Android Release APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      DEFAULT_AI_MODEL: gpt-4o-mini

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Set up Android SDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          branch_name="${GITHUB_REF_NAME//\//-}"
          short_sha="${GITHUB_SHA::7}"
          tag="android-${branch_name}-${short_sha}-${GITHUB_RUN_NUMBER}"
          apk_name="screen-translate-${branch_name}-${short_sha}.apk"

          cp app/build/outputs/apk/debug/app-debug.apk "${apk_name}"

          {
            echo "tag=${tag}"
            echo "apk_name=${apk_name}"
            echo "short_sha=${short_sha}"
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              echo "prerelease=false"
            else
              echo "prerelease=true"
            fi
          } >> "${GITHUB_OUTPUT}"

          cat > release-notes.md <<EOF
          Automated Android debug APK for \`${GITHUB_REF_NAME}\`.

          - Commit: \`${GITHUB_SHA}\`
          - Default AI model: \`${DEFAULT_AI_MODEL}\`
          - Validators: \`testDebugUnitTest lintDebug assembleDebug\`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          prerelease_flag=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi

          gh release create "${TAG}" "${APK_NAME}" \
            --target "${GITHUB_SHA}" \
            --title "Android APK ${SHORT_SHA}" \
            --notes-file release-notes.md \
            "${prerelease_flag[@]}"
